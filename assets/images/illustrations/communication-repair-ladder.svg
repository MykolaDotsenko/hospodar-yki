<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Kun en ymmärrä — kolme tapaa pyytää tarkennusta</title>
<desc id="desc">Kolme ilmausta: En ymmärrä; Voisitko sanoa uudelleen; Voisitko puhua hitaammin. Selitykset ukrainaksi, vasta ensimmäisen itsenäisen yrityksen jälkeen.</desc>
<rect width="960" height="520" rx="22" fill="#F7F6EF"/>
<text x="52" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#083B7A">Kun en ymmärrä</text>
<text x="52" y="108" font-family="Arial,sans-serif" font-size="20" fill="#46564F">Після першої спроби: три кроки для уточнення</text>
<rect x="52" y="140" width="856" height="93" rx="16" fill="#E3EEE8" stroke="#668779" stroke-width="2"/>
<text x="82" y="179" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#1C4437">1. En ymmärrä.</text>
<text x="82" y="213" font-family="Arial,sans-serif" font-size="21" fill="#253B32">Я не розумію.</text>
<rect x="52" y="255" width="856" height="93" rx="16" fill="#E5EFFA" stroke="#7495BA" stroke-width="2"/>
<text x="82" y="295" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#083B7A">2. Voisitko sanoa uudelleen?</text>
<text x="82" y="328" font-family="Arial,sans-serif" font-size="21" fill="#253B32">Не могли б ви повторити?</text>
<rect x="52" y="370" width="856" height="93" rx="16" fill="#FBF0D6" stroke="#BC9952" stroke-width="2"/>
<text x="82" y="408" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#5A4319">3. Voisitko puhua hitaammin?</text>
<text x="82" y="441" font-family="Arial,sans-serif" font-size="21" fill="#253B32">Не могли б ви говорити повільніше?</text>
<text x="52" y="493" font-family="Arial,sans-serif" font-size="15" fill="#46564F">LEARN — підказка тільки після самостійної відповіді · Hospodar YKI</text>
</svg>
