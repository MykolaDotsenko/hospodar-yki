name: Validate locally stored Finnish audio
on:
  push:
    branches: [main]
    paths:
      - assets/audio/available.json
      - sources/audio/recording-sources.json
      - audio/segments/**
      - audio/open/**
      - scripts/validate_audio_assets.py
      - .github/workflows/validate-audio-assets.yml
  pull_request:
    paths:
      - assets/audio/available.json
      - sources/audio/recording-sources.json
      - audio/segments/**
      - audio/open/**
      - scripts/validate_audio_assets.py
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_audio_assets.py
