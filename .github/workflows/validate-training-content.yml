name: Validate YKI educational content
on:
  push:
    branches: [main]
    paths:
      - 'learning/exercises/**'
      - 'scripts/validate_training_content.mjs'
      - '.github/workflows/validate-training-content.yml'
  pull_request:
    paths:
      - 'learning/exercises/**'
      - 'scripts/validate_training_content.mjs'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate machine-readable B1 material and scoring constraints
        run: node scripts/validate_training_content.mjs
