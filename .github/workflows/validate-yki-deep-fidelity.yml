name: Validate YKI official digital fidelity evidence
on:
  push:
    branches: [main, 'research/**']
    paths:
      - 'research/yki/20-yki-official-complete-audit-2026-10.md'
      - 'docs/21-digital-yki-exam-simulator-executable-spec.md'
      - 'docs/14-digital-yki-fidelity-spec.md'
      - 'research/yki/13-yki-exam-format-and-real-examples-2027.md'
      - 'docs/15-two-modes-skill-scopes.md'
      - 'research/yki/official-yki-deep-audit-v2.json'
      - 'research/yki/yki-official-patterns-v2.json'
      - 'scripts/validate_yki_deep_fidelity.py'
      - 'README.md'
      - '.github/workflows/validate-yki-deep-fidelity.yml'
  pull_request:
    paths:
      - 'research/yki/20-yki-official-complete-audit-2026-10.md'
      - 'docs/21-digital-yki-exam-simulator-executable-spec.md'
      - 'docs/14-digital-yki-fidelity-spec.md'
      - 'research/yki/13-yki-exam-format-and-real-examples-2027.md'
      - 'docs/15-two-modes-skill-scopes.md'
      - 'research/yki/official-yki-deep-audit-v2.json'
      - 'research/yki/yki-official-patterns-v2.json'
      - 'scripts/validate_yki_deep_fidelity.py'
      - 'README.md'
      - '.github/workflows/validate-yki-deep-fidelity.yml'
permissions:
  contents: read
jobs:
  evidence-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify source provenance and prohibit unverified 2027 digital claims
        run: python3 scripts/validate_yki_deep_fidelity.py
