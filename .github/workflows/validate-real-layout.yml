name: Validate real folder migration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate physical files JSON and important relative links
        run: python3 scripts/validate_folder_layout.py
      - name: Validate CI filters and active documentation references
        run: python3 scripts/validate_doc_integrity.py
      - name: Regression test documentation integrity validator
        run: python3 -m unittest discover -s scripts/tests -p 'test_validate_doc_integrity.py' -v
      - name: Enforce reusable domain/module boundaries
        run: python3 scripts/validate_architecture_boundaries.py
      - name: Regression test architecture import boundaries
        run: python3 -m unittest discover -s scripts/tests -p 'test_validate_architecture_boundaries.py' -v
      - name: Python syntax all scripts
        run: python3 -m compileall -q scripts
      - name: Exercise Markdown link validator positive and negative fixtures
        run: python3 -m unittest discover -s scripts/tests -p 'test_validate_folder_layout.py' -v
      - name: JavaScript syntax and unit tests
        run: |
          for x in app/*.mjs; do node --check "$x"; done
          node --test app/tests/*.test.mjs
          node --test packages/contracts/tests/*.test.mjs
      - name: Architecture and app content checks
        run: |
          python3 scripts/validate_architecture_decision.py
          python3 scripts/validate_android_game_architecture.py
          python3 scripts/validate_reliability_architecture.py
          python3 scripts/validate_ai_docs.py
          python3 scripts/validate_learning_methods.py
          python3 scripts/validate_audio_assets.py
          python3 scripts/validate_youtube_video_catalog.py
