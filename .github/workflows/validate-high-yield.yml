name: Validate high-yield B1 content
on:
  push:
    branches: [main]
    paths:
      - 'learning/exercises/b1/high-yield/**'
      - 'scripts/validate_high_yield.mjs'
      - '.github/workflows/validate-high-yield.yml'
  pull_request:
    paths:
      - 'learning/exercises/b1/high-yield/**'
      - 'scripts/validate_high_yield.mjs'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node scripts/validate_high_yield.mjs
