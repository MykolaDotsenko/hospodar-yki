name: Validate high-yield B1 content
on:
  push:
    branches: [main]
    paths:
      - 'content/b1/high-yield/**'
      - 'scripts/validate_high_yield.mjs'
      - '.github/workflows/validate-high-yield.yml'
  pull_request:
    paths:
      - 'content/b1/high-yield/**'
      - 'scripts/validate_high_yield.mjs'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate_high_yield.mjs
