name: Validate YKI listening discovery catalogue

on:
  push:
    branches: [main]
    paths:
      - 'sources/audio/yki-targeted-sources-2026-10.json'
      - 'sources/audio/recording-sources.json'
      - 'sources/audio/YKI-LISTENING-RESEARCH-2026-10.md'
      - 'scripts/validate_yki_listening_sources.py'
      - '.github/workflows/validate-yki-listening-sources.yml'
  pull_request:
    paths:
      - 'sources/audio/yki-targeted-sources-2026-10.json'
      - 'sources/audio/recording-sources.json'
      - 'sources/audio/YKI-LISTENING-RESEARCH-2026-10.md'
      - 'scripts/validate_yki_listening_sources.py'
      - '.github/workflows/validate-yki-listening-sources.yml'
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check external audio links, source types and attribution metadata
        run: python3 scripts/validate_yki_listening_sources.py
