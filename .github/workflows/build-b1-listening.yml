name: Build Finnish B1 listening lessons (Piper)
on:
  push:
    branches: [main]
    paths:
      - scripts/build_b1_synthetic_audio.py
      - .github/workflows/build-b1-listening.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install voice runtime and audio codec
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check 'piper-tts==1.3.0'
      - name: Fetch and verify Finnish open-license voice (not committed to git)
        run: |
          set -euo pipefail
          mkdir -p /tmp/hospodar-yki-piper
          BASE=https://huggingface.co/rhasspy/piper-voices/resolve/main/fi/fi_FI/harri/medium
          curl --fail --location --silent --show-error --retry 3 --retry-delay 3 "$BASE/fi_FI-harri-medium.onnx" -o /tmp/hospodar-yki-piper/fi_FI-harri-medium.onnx
          curl --fail --location --silent --show-error --retry 3 --retry-delay 3 "$BASE/fi_FI-harri-medium.onnx.json" -o /tmp/hospodar-yki-piper/fi_FI-harri-medium.onnx.json
          echo 'a44167faa34caed940e4fcad139fcc35922266b2593bcebe77701774c0fb2389  /tmp/hospodar-yki-piper/fi_FI-harri-medium.onnx' | sha256sum -c -
          command -v piper
      - name: Synthesize 23 lessons with transcripts, keys and rate variants
        run: python scripts/build_b1_synthetic_audio.py
      - name: Save original learning audio and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- audio/tts/harri/ learning/exercises/b1/audio-training/index.json
          if git diff --cached --quiet; then
            echo "No new audio files"
          else
            git commit -m "audio: add original synthetic Finnish B1 listening lessons [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
