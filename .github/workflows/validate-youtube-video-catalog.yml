name: Validate Finnish YouTube learning link catalog
on:
  pull_request:
    paths:
      - video/youtube-catalog.json
      - video/publisher-series-catalog.json
      - video/YOUTUBE-AND-PUBLISHERS-HIGH-VALUE-ROUND3-2026-10.md
      - video/YOUTUBE-LEARNING-CATALOG.md
      - scripts/validate_youtube_video_catalog.py
      - .github/workflows/validate-youtube-video-catalog.yml
  push:
    branches: [main, content/youtube-b1-yki-video-catalog-2026-10-21]
    paths:
      - video/youtube-catalog.json
      - video/YOUTUBE-LEARNING-CATALOG.md
      - scripts/validate_youtube_video_catalog.py
      - .github/workflows/validate-youtube-video-catalog.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON catalog and preview ranges
        run: |
          python3 -m json.tool video/youtube-catalog.json > /dev/null
          python3 -m json.tool video/publisher-series-catalog.json > /dev/null
          python3 scripts/validate_youtube_video_catalog.py
      - name: Sanity check future-player requirements and rights statements
        run: |
          grep -q 'YTP-14' video/YOUTUBE-LEARNING-CATALOG.md
          grep -q 'IFrame Player API' video/YOUTUBE-LEARNING-CATALOG.md
          grep -q 'Do not download' video/youtube-catalog.json
