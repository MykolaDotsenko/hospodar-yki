name: Validate Finnish YouTube learning link catalog
on:
  pull_request:
    paths:
      - sources/youtube/youtube-catalog.json
      - sources/official/yki-mock-simulation-sources.json
      - sources/official/YKI-MOCK-VIDEO-SOURCES-2026-10.md
      - sources/publishers/publisher-series-catalog.json
      - sources/publishers/publisher-episode-catalog.json
      - sources/youtube/YOUTUBE-AND-YLE-B1-HIGH-VALUE-ROUND5-2026-10.md
      - sources/youtube/YOUTUBE-AND-PUBLISHERS-HIGH-VALUE-ROUND3-2026-10.md
      - sources/youtube/YOUTUBE-LEARNING-CATALOG.md
      - scripts/validate_youtube_video_catalog.py
      - .github/workflows/validate-youtube-video-catalog.yml
  push:
    branches: [main, research/yki-mock-video-classification-2026-10-21]
    paths:
      - sources/youtube/youtube-catalog.json
      - sources/official/yki-mock-simulation-sources.json
      - sources/official/YKI-MOCK-VIDEO-SOURCES-2026-10.md
      - sources/publishers/publisher-series-catalog.json
      - sources/publishers/publisher-episode-catalog.json
      - sources/youtube/YOUTUBE-AND-YLE-B1-HIGH-VALUE-ROUND5-2026-10.md
      - sources/youtube/YOUTUBE-AND-PUBLISHERS-HIGH-VALUE-ROUND3-2026-10.md
      - sources/youtube/YOUTUBE-LEARNING-CATALOG.md
      - scripts/validate_youtube_video_catalog.py
      - .github/workflows/validate-youtube-video-catalog.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON catalog and preview ranges
        run: |
          python3 -m json.tool sources/youtube/youtube-catalog.json > /dev/null
          python3 -m json.tool sources/official/yki-mock-simulation-sources.json > /dev/null
          python3 -m json.tool sources/publishers/publisher-series-catalog.json > /dev/null
          python3 -m json.tool sources/publishers/publisher-episode-catalog.json > /dev/null
          python3 scripts/validate_youtube_video_catalog.py
      - name: Sanity check future-player requirements and rights statements
        run: |
          grep -q 'YTP-14' sources/youtube/YOUTUBE-LEARNING-CATALOG.md
          grep -q 'IFrame Player API' sources/youtube/YOUTUBE-LEARNING-CATALOG.md
          grep -q 'Do not download' sources/youtube/youtube-catalog.json
