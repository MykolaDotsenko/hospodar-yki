name: Validate B1 Finnish listening audio and answer keys
on:
  push:
    branches: [main]
    paths:
      - 'assets/audio/tts/**'
      - 'learning/exercises/b1/audio-training/index.json'
      - 'scripts/validate_b1_audio_pack.py'
      - '.github/workflows/validate-b1-audio.yml'
  pull_request:
    paths:
      - 'assets/audio/tts/**'
      - 'learning/exercises/b1/audio-training/index.json'
      - 'scripts/validate_b1_audio_pack.py'
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check 37 real OGGs, SHA, 23 transcripts and 56 answers
        run: python3 scripts/validate_b1_audio_pack.py
