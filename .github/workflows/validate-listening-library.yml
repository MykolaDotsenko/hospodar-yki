name: Validate unified YKI listening library and study plan
on:
  push:
    branches: [main]
    paths:
      - assets/audio/library.json
      - learning/plans/listening-4-weeks.json
      - scripts/validate_listening_library.py
      - .github/workflows/validate-listening-library.yml
  pull_request:
    paths:
      - assets/audio/library.json
      - learning/plans/listening-4-weeks.json
      - scripts/validate_listening_library.py
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_listening_library.py
