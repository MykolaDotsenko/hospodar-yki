name: Validate YKI exam pattern research
on:
  push:
    branches: [main, 'research/**']
    paths:
      - 'research/yki/13-yki-exam-format-and-real-examples-2027.md'
      - 'research/yki/yki-exam-examples-2026-10.json'
      - 'learning/exercises/b1/exam-patterns/**'
      - 'learning/exercises/b1/audio-long/lessons.json'
      - 'learning/exercises/b1/contextual/reading-pack-v1.json'
      - 'learning/exercises/b1/diagnostics/baseline-v1.json'
      - 'scripts/validate_yki_exam_research.py'
      - '.github/workflows/validate-yki-exam-research.yml'
  pull_request:
    paths:
      - 'research/yki/13-yki-exam-format-and-real-examples-2027.md'
      - 'research/yki/yki-exam-examples-2026-10.json'
      - 'learning/exercises/b1/exam-patterns/**'
      - 'learning/exercises/b1/audio-long/lessons.json'
      - 'learning/exercises/b1/contextual/reading-pack-v1.json'
      - 'learning/exercises/b1/diagnostics/baseline-v1.json'
      - 'scripts/validate_yki_exam_research.py'
      - '.github/workflows/validate-yki-exam-research.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate sources, dates, licenses and four-skill mini-rehearsals
        run: python3 scripts/validate_yki_exam_research.py
