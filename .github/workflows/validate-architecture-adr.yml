name: Validate Hospodar YKI architecture decision
on:
  push:
    branches: [main, 'architecture/**']
    paths:
      - 'docs/22-optimal-stack-and-architecture-adr-2026-10.md'
      - 'docs/23-android-offline-game-and-3gb-media-architecture.md'
      - 'docs/24-reliability-hardened-architecture-web-android.md'
      - 'research/architecture/reliability-architecture-adr-v1.json'
      - 'scripts/validate_reliability_architecture.py'
      - 'research/architecture/android-game-distribution-v1.json'
      - 'scripts/validate_android_game_architecture.py'
      - 'docs/12-mvp-architecture.md'
      - 'docs/15-two-modes-skill-scopes.md'
      - 'research/architecture/architecture-decision-v1.json'
      - 'scripts/validate_architecture_decision.py'
      - 'apps/web/**'
      - 'README.md'
      - '.github/workflows/validate-architecture-adr.yml'
  pull_request:
    paths:
      - 'docs/22-optimal-stack-and-architecture-adr-2026-10.md'
      - 'docs/23-android-offline-game-and-3gb-media-architecture.md'
      - 'docs/24-reliability-hardened-architecture-web-android.md'
      - 'research/architecture/reliability-architecture-adr-v1.json'
      - 'scripts/validate_reliability_architecture.py'
      - 'research/architecture/android-game-distribution-v1.json'
      - 'scripts/validate_android_game_architecture.py'
      - 'docs/12-mvp-architecture.md'
      - 'docs/15-two-modes-skill-scopes.md'
      - 'research/architecture/architecture-decision-v1.json'
      - 'scripts/validate_architecture_decision.py'
      - 'apps/web/**'
      - 'README.md'
      - '.github/workflows/validate-architecture-adr.yml'
permissions:
  contents: read
jobs:
  adr-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check architecture decision truth and linked acceptance requirements
        run: |
          python3 scripts/validate_architecture_decision.py
          python3 scripts/validate_android_game_architecture.py
          python3 scripts/validate_reliability_architecture.py
