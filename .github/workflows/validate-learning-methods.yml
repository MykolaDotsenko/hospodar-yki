name: Validate learning research registry
on:
  push:
    branches: [main]
    paths:
      - 'research/pedagogy/learning-methods-v1.json'
      - 'research/pedagogy/learning-effectiveness-ratings-v1.json'
      - 'research/pedagogy/yki-methodology-implementation-v1.json'
      - 'research/pedagogy/08-learning-methods-evidence-2026-10.md'
      - 'research/pedagogy/11-advanced-yki-learning-methods-2026-10.md'
      - 'research/pedagogy/12-finnish-yki-learning-effectiveness-2026-10.md'
      - 'scripts/validate_learning_methods.py'
      - '.github/workflows/validate-learning-methods.yml'
  pull_request:
    paths:
      - 'research/pedagogy/learning-methods-v1.json'
      - 'research/pedagogy/learning-effectiveness-ratings-v1.json'
      - 'research/pedagogy/yki-methodology-implementation-v1.json'
      - 'research/pedagogy/08-learning-methods-evidence-2026-10.md'
      - 'research/pedagogy/11-advanced-yki-learning-methods-2026-10.md'
      - 'research/pedagogy/12-finnish-yki-learning-effectiveness-2026-10.md'
      - 'scripts/validate_learning_methods.py'
      - '.github/workflows/validate-learning-methods.yml'
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate scoring rubric, references, rankings and metadata
        run: python3 scripts/validate_learning_methods.py
