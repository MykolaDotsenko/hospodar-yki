name: Import public-domain Finnish human voices (LibriVox)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install audio codec
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download public-domain voices and make short audio lessons
        run: python3 scripts/import_librivox_human.py
      - name: Validate actual clips and library consistency
        run: |
          python3 scripts/validate_librivox_human.py
          python3 scripts/validate_listening_library.py
      - name: Commit real audio and structured lessons to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/audio/human/librivox/ learning/exercises/b1/audio-training/librivox-human.json assets/audio/library.json
          if git diff --cached --quiet; then
            echo "No new audio"
          else
            git commit -m "audio: add public-domain Finnish human narration excerpts [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
