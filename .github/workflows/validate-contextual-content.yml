name: Validate YKI content research and contextual materials
on:
  push:
    branches: [main]
    paths:
      - 'knowledge/dictionaries/b1/**'
      - 'learning/exercises/b1/contextual/**'
      - 'knowledge/dictionaries/b1/rektio-v1.json'
      - 'learning/exercises/b1/grammar/ftb-frequency-cloze-v1.json'
      - 'scripts/validate_ftb_corpus_bank.py'
      - 'research/yki/yki-content-sources-2026-10.json'
      - 'scripts/validate_contextual_content.py'
      - '.github/workflows/validate-contextual-content.yml'
  pull_request:
    paths:
      - 'knowledge/dictionaries/b1/**'
      - 'learning/exercises/b1/contextual/**'
      - 'knowledge/dictionaries/b1/rektio-v1.json'
      - 'learning/exercises/b1/grammar/ftb-frequency-cloze-v1.json'
      - 'scripts/validate_ftb_corpus_bank.py'
      - 'research/yki/yki-content-sources-2026-10.json'
      - 'scripts/validate_contextual_content.py'
      - '.github/workflows/validate-contextual-content.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify licensed frequency list, learning examples, comprehension keys and rights metadata
        run: |
          python3 scripts/validate_contextual_content.py
          python3 scripts/validate_ftb_corpus_bank.py
