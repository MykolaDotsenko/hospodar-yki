name: Validate YKI masterclasses
on:
  push:
    branches: [main]
    paths:
      - 'learning/exercises/b1/masterclasses/**'
      - 'sources/learning/10-yki-resources-machine-index.json'
      - 'scripts/validate_masterclasses.mjs'
      - '.github/workflows/validate-masterclasses.yml'
  pull_request:
    paths:
      - 'learning/exercises/b1/masterclasses/**'
      - 'sources/learning/10-yki-resources-machine-index.json'
      - 'scripts/validate_masterclasses.mjs'
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node scripts/validate_masterclasses.mjs
