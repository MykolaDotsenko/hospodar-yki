name: Validate new A2–B1 open learning sources
on:
  push:
    branches: [main]
    paths:
      - 'sources/learning/a2-b1-verified-source-missions-2026-10.json'
      - 'scripts/validate_a2_b1_open_sources.py'
      - 'scripts/tests/test_validate_a2_b1_open_sources.py'
      - 'app/authentic-listening-core.mjs'
      - 'app/authentic-listening.mjs'
      - 'app/tests/authentic-listening-core.test.mjs'
      - '.github/workflows/validate-a2-b1-open-sources.yml'
  pull_request:
    paths:
      - 'sources/learning/a2-b1-verified-source-missions-2026-10.json'
      - 'scripts/validate_a2_b1_open_sources.py'
      - 'scripts/tests/test_validate_a2_b1_open_sources.py'
      - 'app/authentic-listening-core.mjs'
      - 'app/authentic-listening.mjs'
      - 'app/tests/authentic-listening-core.test.mjs'
      - '.github/workflows/validate-a2-b1-open-sources.yml'
permissions:
  contents: read
jobs:
  verified-source-missions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify source rights, language level status, absence of fake audio or grading
        run: |
          python3 scripts/validate_a2_b1_open_sources.py
          python3 -m unittest discover -s scripts/tests -p 'test_validate_a2_b1_open_sources.py' -v
      - name: Test staged Web LEARN with all 35 sources and syntax check
        run: |
          node --test app/tests/authentic-listening-core.test.mjs
          node --check app/authentic-listening.mjs
          node --check app/authentic-listening-core.mjs
