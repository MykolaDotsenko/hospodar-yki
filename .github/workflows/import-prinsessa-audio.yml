name: Import complete 2m39s Finnish human story + source transcript
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install and verify ffmpeg tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffprobe
      - name: Download complete public-domain Finnish narration and matching published Finnish text
        run: python3 scripts/import_prinsessa_audio.py
      - name: Commit full narration and original printed transcript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/audio/human/short-stories/ learning/exercises/b1/audio-long/human-stories.json assets/audio/library.json
          if git diff --cached --quiet; then
            echo "Narration and transcript already up to date"
          else
            git commit -m "audio: add complete 2m39s human Finnish story and Gutenberg source text [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
