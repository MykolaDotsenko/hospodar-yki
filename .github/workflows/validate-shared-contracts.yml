name: Validate shared contracts
on:
  push:
    paths:
      - 'packages/contracts/**'
      - '.github/workflows/validate-shared-contracts.yml'
  pull_request:
    paths:
      - 'packages/contracts/**'
      - '.github/workflows/validate-shared-contracts.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test packages/contracts/tests/*.test.mjs
