name: Validate shared contracts
on:
  push:
    paths:
      - 'packages/contracts/**'
      - '.github/workflows/validate-shared-contracts.yml'
  pull_request:
    paths:
      - 'packages/contracts/**'
      - '.github/workflows/validate-shared-contracts.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test packages/contracts/tests/*.test.mjs
