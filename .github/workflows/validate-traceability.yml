name: validate-traceability

# Requirement ↔ evidence matrix + completeness gate. Broad paths on purpose: any doc/research change can define a
# new requirement, and any test change can delete the evidence a requirement relies on.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'research/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'app/tests/**'
      - 'tools/architecture/tests/**'
      - 'scripts/tests/**'
      - 'scripts/validate_design_traceability.py'
      - '.github/workflows/validate-web-app.yml'
      - '.github/workflows/validate-traceability.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'research/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'app/tests/**'
      - 'tools/architecture/tests/**'
      - 'scripts/tests/**'
      - 'scripts/validate_design_traceability.py'
      - '.github/workflows/validate-web-app.yml'
      - '.github/workflows/validate-traceability.yml'
permissions:
  contents: read
jobs:
  traceability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Every requirement has an honest status, evidence tests exist, no untraced requirement family
        run: |
          python3 scripts/validate_design_traceability.py
          python3 -m unittest discover -s scripts/tests -p 'test_validate_design_traceability.py' -v
