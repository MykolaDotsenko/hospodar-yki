name: Validate Hospodar YKI MVP
on:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'app/**'
      - 'packages/contracts/**'
      - 'scripts/run-chromium-idb.mjs'
      - 'learning/exercises/b1/grammar/contextual-cloze.json'
      - 'learning/exercises/b1/grammar/delayed-transfer-v1.json'
      - 'learning/exercises/b1/diagnostics/baseline-v1.json'
      - 'learning/exercises/b1/audio-long/**'
      - 'learning/exercises/b1/contextual/reading-pack-v1.json'
      - '.github/workflows/validate-app-mvp.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'packages/contracts/**'
      - 'scripts/run-chromium-idb.mjs'
      - 'learning/exercises/b1/grammar/contextual-cloze.json'
      - 'learning/exercises/b1/grammar/delayed-transfer-v1.json'
      - 'learning/exercises/b1/diagnostics/baseline-v1.json'
      - 'learning/exercises/b1/audio-long/**'
      - 'learning/exercises/b1/contextual/reading-pack-v1.json'
      - '.github/workflows/validate-app-mvp.yml'
permissions:
  contents: read
jobs:
  browser-core:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate module syntax
        run: |
          node --check app/core.mjs
          node --check app/app.mjs
      - name: Unit and real-content integration tests
        run: node --test app/tests/*.test.mjs
      - name: Real Chromium IndexedDB durability and concurrency test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/yki-browser-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..25}; do
            if curl -fsS http://127.0.0.1:8765/app/tests/atomic-idb-browser.html >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          if command -v google-chrome >/dev/null; then
            export CHROME_BINARY=google-chrome
          elif command -v chromium >/dev/null; then
            export CHROME_BINARY=chromium
          else
            echo "Chromium is required to test real IndexedDB"
            exit 1
          fi
          node scripts/run-chromium-idb.mjs
