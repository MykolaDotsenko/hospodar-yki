name: Validate Hospodar YKI MVP
on:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'app/**'
      - 'content/b1/grammar/contextual-cloze.json'
      - 'content/b1/diagnostics/baseline-v1.json'
      - 'content/b1/audio-long/**'
      - 'content/b1/contextual/reading-pack-v1.json'
      - '.github/workflows/validate-app-mvp.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'content/b1/grammar/contextual-cloze.json'
      - 'content/b1/diagnostics/baseline-v1.json'
      - 'content/b1/audio-long/**'
      - 'content/b1/contextual/reading-pack-v1.json'
      - '.github/workflows/validate-app-mvp.yml'
permissions:
  contents: read
jobs:
  browser-core:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate module syntax
        run: |
          node --check app/core.mjs
          node --check app/app.mjs
      - name: Unit and real-content integration tests
        run: node --test app/tests/*.test.mjs
      - name: Real Chromium IndexedDB durability and concurrency test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/yki-browser-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..25}; do
            if curl -fsS http://127.0.0.1:8765/app/tests/atomic-idb-browser.html >/dev/null; then break; fi
            sleep 0.2
          done
          if command -v google-chrome >/dev/null; then
            chrome=google-chrome
          elif command -v chromium >/dev/null; then
            chrome=chromium
          else
            echo "No Chromium/Google Chrome installed; IDB E2E cannot be skipped"
            exit 1
          fi
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=15000 --dump-dom \
            http://127.0.0.1:8765/app/tests/atomic-idb-browser.html \
            > /tmp/yki-idb-result.html 2>/tmp/yki-chrome.log
          grep -q 'data-result="PASS"' /tmp/yki-idb-result.html || {
            tail -n 50 /tmp/yki-idb-result.html
            tail -n 50 /tmp/yki-chrome.log
            exit 1
          }

