name: Validate repository taxonomy and provenance

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'sources/**'
      - 'knowledge/**'
      - 'learning/**'
      - 'research/**'
      - 'catalog/**'
      - 'content/**'
      - 'audio/**'
      - 'video/**'
      - 'brand/logo/**'
      - 'docs/CONTENT-ARCHITECTURE.md'
      - 'scripts/validate_repository_taxonomy.py'
      - 'scripts/tests/test_validate_repository_taxonomy.py'
      - '.github/workflows/validate-repository-taxonomy.yml'
  pull_request:
    paths:
      - 'assets/**'
      - 'sources/**'
      - 'knowledge/**'
      - 'learning/**'
      - 'research/**'
      - 'catalog/**'
      - 'content/**'
      - 'audio/**'
      - 'video/**'
      - 'brand/logo/**'
      - 'docs/CONTENT-ARCHITECTURE.md'
      - 'scripts/validate_repository_taxonomy.py'
      - 'scripts/tests/test_validate_repository_taxonomy.py'
      - '.github/workflows/validate-repository-taxonomy.yml'

permissions:
  contents: read

jobs:
  taxonomy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests for ownership and media-hash violations
        run: python3 -m unittest discover -s scripts/tests -p 'test_validate_repository_taxonomy.py' -v
      - name: Verify categories, source ownership, original binary hashes and links
        run: python3 scripts/validate_repository_taxonomy.py
