name: Validate Hospodar brand identity
on:
  push:
    branches: [main, 'design/**', 'research/**']
    paths:
      - 'brand/**'
      - 'app/index.html'
      - 'app/exam.html'
      - 'app/styles.css'
      - 'app/exam.css'
      - 'app/tokens.css'
      - 'scripts/validate_design_tokens.py'
      - 'scripts/tests/test_validate_design_tokens.py'
      - 'scripts/validate_design_traceability.py'
      - 'scripts/tests/test_validate_design_traceability.py'
      - 'docs/design/**'
      - 'docs/15-two-modes-skill-scopes.md'
      - 'docs/11-mvp-product-requirements.md'
      - 'research/ux/**'
      - 'research/design/**'
      - 'apps/web/e2e/**'
      - 'app/exam.mjs'
      - 'app/app.mjs'
      - 'research/design/16-color-attention-memory-research-2026-10.md'
      - 'research/design/color-memory-evidence-v1.json'
      - 'scripts/validate_color_memory_policy.py'
      - 'scripts/validate_brand_identity.py'
      - '.github/workflows/validate-brand-identity.yml'
  pull_request:
    paths:
      - 'brand/**'
      - 'app/index.html'
      - 'app/exam.html'
      - 'app/styles.css'
      - 'app/exam.css'
      - 'app/tokens.css'
      - 'scripts/validate_design_tokens.py'
      - 'scripts/tests/test_validate_design_tokens.py'
      - 'scripts/validate_design_traceability.py'
      - 'scripts/tests/test_validate_design_traceability.py'
      - 'docs/design/**'
      - 'docs/15-two-modes-skill-scopes.md'
      - 'docs/11-mvp-product-requirements.md'
      - 'research/ux/**'
      - 'research/design/**'
      - 'apps/web/e2e/**'
      - 'app/exam.mjs'
      - 'app/app.mjs'
      - 'research/design/16-color-attention-memory-research-2026-10.md'
      - 'research/design/color-memory-evidence-v1.json'
      - 'scripts/validate_color_memory_policy.py'
      - 'scripts/validate_brand_identity.py'
      - '.github/workflows/validate-brand-identity.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify SVG mark, two-mode navigation and accessible color pairs
        run: python3 scripts/validate_brand_identity.py
      - name: Verify source-grounded color-memory cue policy
        run: python3 scripts/validate_color_memory_policy.py
      - name: Verify tokens.json is the only app colour source, contrast pairs and DESIGN-01a roles
        run: |
          python3 scripts/validate_design_tokens.py
          python3 -m unittest discover -s scripts/tests -p 'test_validate_design_tokens.py' -v
      - name: Design ↔ research traceability (every requirement has an honest status; evidence tests exist)
        run: |
          python3 scripts/validate_design_traceability.py
          python3 -m unittest discover -s scripts/tests -p 'test_validate_design_traceability.py' -v
