name: Validate React web app (G2)
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/domain/**'
      - 'app/core.mjs'
      - 'app/tokens.css'
      - 'brand/tokens.json'
      - 'learning/exercises/**'
      - 'knowledge/dictionaries/**'
      - 'scripts/validate_content_publication.py'
      - 'scripts/apply_review_decisions.py'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/validate-web-app.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/domain/**'
      - 'app/core.mjs'
      - 'app/tokens.css'
      - 'brand/tokens.json'
      - 'learning/exercises/**'
      - 'knowledge/dictionaries/**'
      - 'scripts/validate_content_publication.py'
      - 'scripts/apply_review_decisions.py'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/validate-web-app.yml'
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked dependencies (pnpm via corepack)
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Domain parity with legacy app/core.mjs (TZ=Europe/Helsinki) and mission rules
        run: pnpm --filter @hospodar/domain test
      - name: Strict TypeScript
        run: pnpm -r typecheck
      - name: Dexie repository unit tests
        run: pnpm --filter @hospodar/web test
      - name: Build
        run: pnpm --filter @hospodar/web build
  # The same full E2E suite on each engine, in parallel jobs (19.11.2026: one serial job for all three engines
  # outgrew 35 min). Every test still runs on Chromium, Firefox and WebKit; within a job tests stay serial (workers: 1).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    name: e2e (${{ matrix.browser }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked dependencies (pnpm via corepack)
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Playwright E2E + axe on ${{ matrix.browser }}
        working-directory: apps/web
        run: |
          pnpm exec playwright install --with-deps ${{ matrix.browser }}
          pnpm exec playwright test
        env:
          CI: 'true'
          E2E_BROWSERS: ${{ matrix.browser }}
