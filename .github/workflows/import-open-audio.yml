name: Import openly licensed YKI practice audio
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-open-audio:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download only approved open-licensed audio
        run: python3 scripts/download_open_yki_audio.py
      - name: Commit audio binaries to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/audio/open/
          if git diff --cached --quiet; then
            echo "No new audio binaries to commit"
          else
            git commit -m "audio: import openly licensed Finnish recordings [skip ci]"
            git push origin HEAD:main
          fi
