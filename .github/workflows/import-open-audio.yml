name: Import openly licensed YKI practice audio
on:
  push:
    branches: [main]
    paths:
      - audio/catalog.json
      - scripts/download_open_yki_audio.py
      - .github/workflows/import-open-audio.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-open-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download only approved open-licensed audio
        run: python3 scripts/download_open_yki_audio.py
      - name: Commit audio binaries to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- audio/open/
          if git diff --cached --quiet; then
            echo "No new audio binaries to commit"
          else
            git commit -m "audio: import openly licensed Finnish recordings [skip ci]"
            git push origin HEAD:main
          fi
