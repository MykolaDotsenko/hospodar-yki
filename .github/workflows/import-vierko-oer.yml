name: Import CC BY-SA Finnish S2 learning PDFs
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Fetch original licensed PDFs
        run: python3 scripts/import_vierko_oer.py
      - name: Commit permitted source materials (partial success allowed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- knowledge/books/VIERKO-2024/*.pdf
          if git diff --cached --quiet; then
            echo "No new PDFs"
          else
            git commit -m "content(oer): archive original VIERKO CC BY-SA 4.0 S2 PDFs [skip ci]"
            git push origin HEAD:main
          fi
