name: Build CC BY-SA Finnish listening excerpts
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  excerpt:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install and verify ffmpeg + ffprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - name: Produce small listening clips from licensed full recordings
        run: python3 scripts/build_listening_excerpts.py
      - name: Save real audio and provenance metadata to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/audio/segments/
          if git diff --cached --quiet; then
            echo "No new excerpts to commit"
          else
            git commit -m "audio: segment licensed Finnish monologues for B1 retrieval [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
