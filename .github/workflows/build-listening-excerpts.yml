name: Build CC BY-SA Finnish listening excerpts
on:
  push:
    branches: [main]
    paths:
      - scripts/build_listening_excerpts.py
      - .github/workflows/build-listening-excerpts.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  excerpt:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check ffmpeg and ffprobe
        run: |
          ffmpeg -version | head -n 2
          ffprobe -version | head -n 2
      - name: Produce small listening clips from licensed full recordings
        run: python3 scripts/build_listening_excerpts.py
      - name: Save real audio and provenance metadata to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- audio/segments/
          if git diff --cached --quiet; then
            echo "No new excerpts to commit"
          else
            git commit -m "audio: segment licensed Finnish monologues for B1 retrieval [skip ci]"
            git push origin HEAD:main
          fi
