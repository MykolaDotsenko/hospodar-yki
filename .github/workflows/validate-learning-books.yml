name: Validate YKI learning book and research bridge
on:
  push:
    branches: [main, 'research/**']
    paths:
      - 'research/pedagogy/19-learning-books-to-engineering-2026-10.md'
      - 'research/pedagogy/learning-blueprints-books-v1.json'
      - 'scripts/validate_learning_books_bridge.py'
      - 'docs/15-two-modes-skill-scopes.md'
      - 'docs/11-mvp-product-requirements.md'
      - 'research/pedagogy/04-evidence-and-learning-science.md'
      - 'README.md'
      - 'research/pedagogy/learning-methods-v1.json'
      - 'docs/12-mvp-architecture.md'
      - '.github/workflows/validate-learning-books.yml'
  pull_request:
    paths:
      - 'research/pedagogy/19-learning-books-to-engineering-2026-10.md'
      - 'research/pedagogy/learning-blueprints-books-v1.json'
      - 'scripts/validate_learning_books_bridge.py'
      - 'docs/15-two-modes-skill-scopes.md'
      - 'docs/11-mvp-product-requirements.md'
      - 'research/pedagogy/04-evidence-and-learning-science.md'
      - 'README.md'
      - 'research/pedagogy/learning-methods-v1.json'
      - 'docs/12-mvp-architecture.md'
      - '.github/workflows/validate-learning-books.yml'
permissions:
  contents: read
jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify source and product spec integrity
        run: python3 scripts/validate_learning_books_bridge.py
