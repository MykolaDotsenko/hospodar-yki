name: Import licensed FLEURS Finnish human speech
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enable OGG encoding and media probing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Import up to 12 real licensed Finnish speaker recordings
        run: python3 scripts/import_fleurs_human_audio.py
      - name: Commit the actual OGG files, verified transcripts and credits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- audio/human/fleurs-fi/ content/b1/audio-training/fleurs-fi.json
          if git diff --cached --quiet; then
            echo "No new files"
          else
            git commit -m "audio: add attributed Finnish human voices with transcripts (FLEURS) [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
